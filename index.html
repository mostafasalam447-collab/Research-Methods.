<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Methods Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0a1628;
  --indigo: #1e3a5f;
  --blue: #1565c0;
  --blue-light: #42a5f5;
  --cyan: #26c6da;
  --emerald: #10b981;
  --red: #ef4444;
  --orange: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--navy);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 80px;
}
.bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12; animation: drift 12s ease-in-out infinite alternate; }
.orb1 { width: 500px; height: 500px; background: #1565c0; top: -100px; left: -100px; }
.orb2 { width: 400px; height: 400px; background: #0d47a1; top: 40%; right: -80px; animation-delay: 3s; }
.orb3 { width: 300px; height: 300px; background: #26c6da; bottom: 10%; left: 20%; animation-delay: 6s; }
@keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(30px,40px) scale(1.08)} }

.sticky {
  position: fixed; top: 0; left: 0; right: 0; z-index: 999;
  background: rgba(10,22,40,0.92); backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(21,101,192,0.3); padding: 10px 20px;
}
.sticky-inner { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { padding: 5px 14px; border-radius: 20px; font-size: .8em; font-weight: 600; white-space: nowrap; }
.pill-q { background: rgba(255,255,255,.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,.2); }
.pill-c { background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid #10b981; }
.pill-w { background: rgba(239,68,68,.2); color: #fca5a5; border: 1px solid #ef4444; }
.pill-p { background: rgba(66,165,245,.2); color: #90caf9; border: 1px solid #42a5f5; }
.prog-wrap { flex:1; background: rgba(255,255,255,.1); border-radius: 8px; height: 6px; min-width: 60px; overflow: hidden; }
.prog-fill { background: linear-gradient(90deg, var(--blue), var(--cyan)); height: 100%; border-radius: 8px; transition: width .5s; }

.page-tabs {
  display: flex; gap: 8px; max-width: 820px; margin: 0 auto; padding: 10px 20px 0;
}
.tab-btn {
  padding: 7px 18px; border-radius: 20px; cursor: pointer; font-size: .83em; font-weight: 600;
  transition: all .2s; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); color: #94a3b8;
  font-family: 'DM Sans', sans-serif;
}
.tab-btn:hover { border-color: var(--blue-light); color: var(--blue-light); background: rgba(66,165,245,.08); }
.tab-btn.active {
  background: linear-gradient(135deg,rgba(21,101,192,.5),rgba(66,165,245,.2));
  border-color: var(--blue-light); color: var(--blue-light); box-shadow: 0 0 14px rgba(66,165,245,.2);
}

#startScreen { position: relative; z-index: 1; max-width: 680px; margin: 80px auto 0; padding: 20px; }
.start-card {
  background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
  border: 1px solid rgba(21,101,192,0.4); border-radius: 24px; padding: 44px 40px;
  box-shadow: 0 40px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,0.1);
}
.atom-icon { font-size: 3.5em; display: block; text-align: center; margin-bottom: 14px; animation: pulse-icon 3s ease-in-out infinite; }
@keyframes pulse-icon {
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 15px rgba(66,165,245,.4))}
  50%{transform:scale(1.06);filter:drop-shadow(0 0 30px rgba(66,165,245,.8))}
}
.start-card h1 { font-family: 'Playfair Display', serif; font-size: 2.2em; font-weight: 900; color: #fff; text-align: center; margin-bottom: 6px; }
.subtitle { text-align: center; color: var(--blue-light); font-size: .95em; margin-bottom: 28px; opacity: .85; }
.section-label { color: #94a3b8; font-size: .8em; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
.filter-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.filter-btn {
  padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: .85em; font-weight: 500;
  transition: all .2s; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); color: #94a3b8;
  font-family: 'DM Sans', sans-serif;
}
.filter-btn:hover { border-color: var(--blue-light); color: var(--blue-light); background: rgba(66,165,245,.08); }
.filter-btn.active {
  background: linear-gradient(135deg,rgba(21,101,192,.5),rgba(66,165,245,.2));
  border-color: var(--blue-light); color: var(--blue-light); box-shadow: 0 0 14px rgba(66,165,245,.2);
}
.start-info { color: #64748b; font-size: .9em; text-align: center; margin-bottom: 22px; }
.start-info span { color: var(--blue-light); font-weight: 700; }
.btn-start {
  width: 100%; padding: 16px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--blue), #0d47a1);
  color: #fff; font-size: 1.1em; font-weight: 700; font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: all .25s; box-shadow: 0 8px 30px rgba(21,101,192,.5);
}
.btn-start:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(21,101,192,.6); }
.by-line { text-align: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(21,101,192,0.25); }
.by-line .designed-text { color: #4a6080; font-size: .75em; letter-spacing: 2px; font-weight: 500; text-transform: uppercase; display: block; margin-bottom: 4px; }
.by-line .name-text { color: var(--blue-light); font-size: 1em; font-weight: 700; letter-spacing: 3px; font-family: 'Playfair Display', serif; display: block; }

#quizWrapper { display: none; padding-top: 75px; position: relative; z-index: 1; }
.q-card {
  max-width: 820px; margin: 18px auto; padding: 28px 32px;
  background: rgba(255,255,255,0.97); border-radius: 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,.3);
  border-left: 5px solid rgba(21,101,192,0.3);
  transition: border-color .35s; animation: slideIn .35s ease both;
}
@keyframes slideIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.q-card.answered-correct { border-left-color: var(--emerald); }
.q-card.answered-wrong   { border-left-color: var(--red); }
.q-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.q-num {
  background: linear-gradient(135deg, var(--blue), #0d47a1);
  color: #fff; min-width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .85em; flex-shrink: 0;
}
.cat-tag { padding: 3px 12px; border-radius: 20px; font-size: .72em; font-weight: 600; color: #fff; }
.cat-tag.mcq { background: linear-gradient(135deg,#1565c0,#0d47a1); }
.cat-tag.tf  { background: linear-gradient(135deg,#00897b,#00695c); }
.page-tag { padding: 3px 10px; border-radius: 12px; font-size: .7em; font-weight: 700; background: rgba(66,165,245,.15); color: #42a5f5; border: 1px solid rgba(66,165,245,.3); }
.q-text { font-size: 1.06em; font-weight: 600; color: #0f172a; line-height: 1.6; margin-bottom: 18px; }
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  padding: 12px 18px; border: 2px solid #e2e8f0; border-radius: 12px;
  cursor: pointer; font-size: .96em; text-align: left;
  background: #fff; color: #334155; transition: all .18s;
  font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 10px; width: 100%;
}
.opt-letter {
  width: 28px; height: 28px; border-radius: 50%;
  background: #f1f5f9; border: 2px solid #cbd5e1;
  display: flex; align-items: center; justify-content: center;
  font-size: .8em; font-weight: 700; color: #64748b; flex-shrink: 0; transition: all .18s;
}
.opt:hover:not(:disabled) { border-color: var(--blue); background: #eff6ff; transform: translateX(5px); }
.opt:hover:not(:disabled) .opt-letter { background: var(--blue); border-color: var(--blue); color: #fff; }
.opt.correct { border-color: var(--emerald); background: #f0fdf4; color: #065f46; font-weight: 600; }
.opt.correct .opt-letter { background: var(--emerald); border-color: var(--emerald); color: #fff; }
.opt.wrong   { border-color: var(--red); background: #fef2f2; color: #7f1d1d; }
.opt.wrong .opt-letter { background: var(--red); border-color: var(--red); color: #fff; }
.opt:disabled { cursor: default; }
.q-feedback { margin-top: 14px; padding: 12px 16px; border-radius: 12px; font-size: .9em; line-height: 1.8; display: none; font-family: 'DM Sans', sans-serif; }
.q-feedback.correct { background: #f0fdf4; border-left: 4px solid var(--emerald); color: #065f46; }
.q-feedback.wrong   { background: #fef2f2; border-left: 4px solid var(--red); color: #7f1d1d; }

.submit-wrap { max-width: 820px; margin: 24px auto; text-align: center; padding: 0 20px; }
.btn-submit {
  padding: 16px 70px; border: none; border-radius: 14px;
  background: linear-gradient(135deg,var(--blue),#0d47a1);
  color: #fff; font-size: 1.1em; font-weight: 700; font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: all .2s; box-shadow: 0 8px 30px rgba(21,101,192,.5);
}
.btn-submit:hover { transform: translateY(-3px); }
.btn-submit:disabled { opacity: .4; cursor: not-allowed; transform: none; }

#resultsBox {
  max-width: 820px; margin: 24px auto; padding: 40px;
  background: rgba(255,255,255,.97); border-radius: 24px;
  text-align: center; display: none;
  box-shadow: 0 30px 80px rgba(0,0,0,.4); animation: slideIn .4s ease;
}
#resultsBox h2 { font-family: 'Playfair Display', serif; color: var(--navy); font-size: 2em; margin-bottom: 8px; }
.score-ring { width: 160px; height: 160px; margin: 20px auto; position: relative; }
.score-ring svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: #e2e8f0; stroke-width: 12; }
.ring-fg { fill: none; stroke: url(#ringGrad); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.4,0,.2,1); }
.score-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.score-center .big   { font-size: 2.4em; font-weight: 900; color: var(--navy); font-family: 'Playfair Display', serif; }
.score-center .small { font-size: .8em; color: #64748b; }
.result-msg { font-size: 1.05em; color: #475569; margin: 10px 0 24px; }
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { border-radius: 16px; padding: 16px 10px; }
.stat-card.c { background: #f0fdf4; border: 2px solid #10b981; }
.stat-card.w { background: #fef2f2; border: 2px solid #ef4444; }
.stat-card.p { background: #eff6ff; border: 2px solid #42a5f5; }
.stat-card .num { font-size: 2em; font-weight: 900; font-family: 'Playfair Display', serif; }
.stat-card.c .num { color: #10b981; }
.stat-card.w .num { color: #ef4444; }
.stat-card.p .num { color: #1565c0; }
.stat-card .lbl { font-size: .8em; color: #64748b; margin-top: 4px; }
.btn-re, .btn-home {
  width: 100%; padding: 14px; border: none; border-radius: 14px;
  font-size: 1.05em; font-weight: 700; font-family: 'DM Sans', sans-serif;
  cursor: pointer; margin-bottom: 10px; transition: all .2s;
}
.btn-re   { background: linear-gradient(135deg,var(--blue),#0d47a1); color: #fff; }
.btn-home { background: #f1f5f9; color: #475569; }
.btn-re:hover   { transform: translateY(-2px); }
.btn-home:hover { background: #e2e8f0; }
.review-section { text-align: left; margin-top: 24px; }
.review-section h3 { color: var(--navy); font-size: 1.1em; margin-bottom: 14px; font-family: 'Playfair Display', serif; }
.rev-item { padding: 14px 16px; border-radius: 12px; margin-bottom: 10px; font-size: .88em; line-height: 1.6; }
.rev-item.wrong { background: #fef2f2; border-left: 4px solid var(--red); }
.rev-item .rt   { font-weight: 700; margin-bottom: 5px; color: #1e293b; }
.rev-item .exp  { color: #64748b; font-size: .9em; margin-top: 5px; }

@media(max-width:600px){
  .start-card{padding:28px 22px}
  .start-card h1{font-size:1.7em}
  .q-card{padding:20px 18px;margin:14px 12px}
  #resultsBox{padding:28px 20px}
}
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="sticky" id="stickyBar" style="display:none">
  <div class="sticky-inner">
    <div class="pill pill-q" id="sNum">0/0</div>
    <div class="pill pill-c" id="sC">✅ 0</div>
    <div class="pill pill-w" id="sW">❌ 0</div>
    <div class="pill pill-p" id="sP">📊 0%</div>
    <div class="prog-wrap"><div class="prog-fill" id="sFill" style="width:0%"></div></div>
  </div>
</div>

<div id="startScreen">
  <div class="start-card">
    <span class="atom-icon">🔬</span>
    <h1>Research Methods Quiz</h1>
    <p class="subtitle">MCQ · True/False — Research Methods Revision</p>
    <div class="by-line" style="margin-top:0;margin-bottom:22px;padding-top:0;border-top:none;">
      <span class="designed-text">Designed &amp; Developed by</span>
      <span class="name-text">𝑴𝑶𝑺𝑻𝑨𝑭𝑨 𝑺𝑨𝑳𝑳𝑨𝑴</span>
    </div>
    <p class="section-label">Choose Section</p>
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" onclick="selectCat('all',this)">📚 الكل</button>
      <button class="filter-btn" onclick="selectCat('mcq',this)">📝 MCQ فقط</button>
      <button class="filter-btn" onclick="selectCat('tf',this)">✅ True/False فقط</button>
    </div>
    <p class="start-info">عدد الأسئلة: <span id="qCount">0</span></p>
    <button class="btn-start" onclick="startQuiz()">ابدأ الكويز ▶</button>
    <div class="by-line">
      <span class="designed-text">Designed &amp; Developed by</span>
      <span class="name-text">𝑴𝑶𝑺𝑻𝑨𝑭𝑨 𝑺𝑨𝑳𝑳𝑨𝑴</span>
    </div>
  </div>
</div>

<div id="quizWrapper">
  <div id="cardsContainer"></div>
  <div class="submit-wrap">
    <button class="btn-submit" id="submitBtn" onclick="showResults()" disabled>Show Results 🎯</button>
  </div>
  <div id="resultsBox">
    <h2>🎉 Quiz Complete!</h2>
    <div class="score-ring">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1565c0"/>
            <stop offset="100%" stop-color="#42a5f5"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="80" cy="80" r="64"/>
        <circle class="ring-fg" id="ringFg" cx="80" cy="80" r="64" stroke-dasharray="402" stroke-dashoffset="402"/>
      </svg>
      <div class="score-center">
        <span class="big" id="rScore">0</span>
        <span class="small">out of <span id="rTotal">0</span></span>
      </div>
    </div>
    <div class="result-msg" id="rMsg"></div>
    <div class="stats-grid">
      <div class="stat-card c"><div class="num" id="rC">0</div><div class="lbl">✅ Correct</div></div>
      <div class="stat-card w"><div class="num" id="rW">0</div><div class="lbl">❌ Wrong</div></div>
      <div class="stat-card p"><div class="num" id="rP">0%</div><div class="lbl">📊 Score</div></div>
    </div>
    <button class="btn-re"   onclick="startQuiz()">🔄 Retry Quiz</button>
    <button class="btn-home" onclick="goHome()">🏠 Home</button>
    <div class="review-section" id="reviewDiv"></div>
  </div>
</div>

<script>
const LETTERS = ['A','B','C','D'];
let currentCat = 'all';
let activeQs = [];
let answered = 0;
let correct = 0;
let wrong = 0;

// ═══════════════════════════════════════════════
//  MCQ QUESTIONS
// ═══════════════════════════════════════════════
const MCQ = [
  {n:1, cat:'mcq', topic:'Research Questions',
   q:"As regard criteria of research questions include which of the following?",
   opts:["Non specific.", "Not reasonable.", "Questions should fulfill criteria of PICO and FINER criteria.", "Difficult to answer"],
   c:2,
   exp:"Research questions should fulfill criteria of PICO and FINER criteria. They must be specific, reasonable, and answerable."},

  {n:2, cat:'mcq', topic:'Sampling',
   q:"Which of the following is the definition of sample?",
   opts:["Result of research", "Selected number of individual cases or selected subjects drawn from larger population.", "Outcome of research", "Analyze the messages in random manner."],
   c:1,
   exp:"A sample is a selected number of individual cases or research subjects drawn from a larger population for a specific study."},

  {n:3, cat:'mcq', topic:'Types of Research',
   q:"……. research carried out to discover something for the sake of knowledge and improve understanding of world?",
   opts:["Basic research", "Applied research", "The conclusion of it is statistically weaker than single study", "Of no importance"],
   c:0,
   exp:"Basic research is carried out to discover something simply for the sake of knowledge and to improve our understanding of the world."},

  {n:4, cat:'mcq', topic:'Study Designs',
   q:"………. is defined as the study which collects data from the same population at different points of time.",
   opts:["Cross sectional study", "Quantitative study", "Longitudinal study", "Data collection"],
   c:2,
   exp:"Longitudinal study collects data from the same population at different points of time (also called cohort study)."},

  {n:5, cat:'mcq', topic:'Statistics',
   q:"Which of the following is correct for the median?",
   opts:["Average of set value", "The half of set values.", "The summation of set values", "The quarter of set values"],
   c:0,
   exp:"The median is the average of the set values — the middle value when arranged in order."},

  {n:6, cat:'mcq', topic:'Research Methods',
   q:"Which of the following is correct for methods of research?",
   opts:["Data collection", "Data analysis", "Studies", "Different data collection and analysis techniques and practices followed in research"],
   c:3,
   exp:"Research methods are the different data collection and analysis techniques and practices followed in research."},

  {n:7, cat:'mcq', topic:'References',
   q:"Which of the following is correct for references?",
   opts:["List of studies", "List of all sources of information used in writing up the research", "List of survey", "List of samples"],
   c:1,
   exp:"References are a list of all sources of information used in writing up the research, within the body of the publication."},

  {n:8, cat:'mcq', topic:'Sampling',
   q:"Which of the following is correct for representative samples?",
   opts:["Samples which include cases or individuals from all subgroups of the targeted population", "Samples which include cases from the same subgroups", "Not generalizable to the population", "Equal non representative sample"],
   c:0,
   exp:"Representative samples include cases or individuals from all subgroups of the targeted population, making results generalizable."},

  {n:9, cat:'mcq', topic:'Data Collection',
   q:"Which of the following is the characteristic of qualitative data collection?",
   opts:["Numerical data", "Can be counted", "Non numerical", "Close ended questions"],
   c:2,
   exp:"Qualitative data is non-numerical — it answers questions of 'how' and 'why', using open-ended questions and observations."},

  {n:10, cat:'mcq', topic:'Data Collection',
   q:"….. is data which is numerical and can be counted?",
   opts:["Qualitative data collection", "Cohort study", "Survey", "Quantitative data collection"],
   c:3,
   exp:"Quantitative data is numerical and can be counted or measured. It answers questions of 'how many' and 'how much'."},

  {n:11, cat:'mcq', topic:'Sampling',
   q:"…… is a selected number of individual cases or research subjects drawn from larger population for a specific study?",
   opts:["Cross sectional study", "SPSS", "Sample", "Analysis"],
   c:2,
   exp:"A sample is a selected number of individual cases or research subjects drawn from a larger population for a specific study."},

  {n:12, cat:'mcq', topic:'Statistics',
   q:"….. is the statistical package for the social sciences and computer software commonly used?",
   opts:["SPSS", "PDF", "PPT", "Word 2013"],
   c:0,
   exp:"SPSS (Statistical Package for the Social Sciences) is a computer software commonly used for quantitative data analysis."},

  {n:13, cat:'mcq', topic:'Study Designs',
   q:"…….. defined as well defined group of individuals who share common characteristic or experience.",
   opts:["Cohort study", "Cross sectional study", "Descriptive study", "Analytical study"],
   c:0,
   exp:"A cohort is a well-defined group of individuals who share a common characteristic or experience (e.g., born in the same year, same exposure)."},

  {n:14, cat:'mcq', topic:'Study Designs',
   q:"Quantitative study design measures which of the following?",
   opts:["Believes", "Attitudes", "Magnitude of the problem and number.", "Situation"],
   c:2,
   exp:"Quantitative study design measures the magnitude of the problem and numbers — it answers 'how many' and 'how much'."},

  {n:15, cat:'mcq', topic:'Study Designs',
   q:"When do we conduct a cross sectional study?",
   opts:["To estimate the prevalence of health condition.", "To estimate the behavior and risk factor of disease.", "To learn about the characteristic of attitude of individuals.", "All of the above"],
   c:3,
   exp:"A cross sectional study is conducted to estimate the prevalence of a health condition, behavior and risk factors, and characteristics/attitudes of individuals. All of the above are correct."},

  {n:16, cat:'mcq', topic:'Study Designs',
   q:"Which of the following is measured by cross sectional study?",
   opts:["Average of population", "Number of existing cases / size of population (or no. of population)", "The median of population", "SPSS"],
   c:1,
   exp:"Cross sectional study measures prevalence = Number of existing cases / size of population. It is a 'snapshot' in time."},

  {n:17, cat:'mcq', topic:'Study Designs',
   q:"Which of the following belongs to case report?",
   opts:["Based on one patient", "Based on collection of different cases", "Similar to cross sectional study", "Similar to descriptive study"],
   c:0,
   exp:"A case report is based on ONE patient — it describes a single clinical observation or unusual case."},

const ALL = [...MCQ, ...TF];

function selectCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  let filtered;
  if (cat === 'all') filtered = ALL;
  else if (cat === 'mcq') filtered = MCQ;
  else filtered = TF;
  document.getElementById('qCount').textContent = filtered.length;
}

function startQuiz() {
  if (currentCat === 'all') activeQs = [...ALL];
  else if (currentCat === 'mcq') activeQs = [...MCQ];
  else activeQs = [...TF];

  answered = 0; correct = 0; wrong = 0;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizWrapper').style.display = 'block';
  document.getElementById('stickyBar').style.display = 'block';
  document.getElementById('resultsBox').style.display = 'none';
  document.getElementById('submitBtn').disabled = true;
  renderCards();
  updateSticky();
}

function renderCards() {
  const cont = document.getElementById('cardsContainer');
  cont.innerHTML = '';
  activeQs.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card_' + idx;

    let catClass = q.cat === 'mcq' ? 'mcq' : 'tf';
    let catLabel = q.cat === 'mcq' ? 'MCQ' : 'True/False';

    let optsHTML = q.opts.map((opt, i) => {
      let letter = q.isTF ? (i === 0 ? 'T' : 'F') : LETTERS[i];
      return `<button class="opt" id="opt_${idx}_${i}" onclick="choose(${idx},${i},${q.c})">
        <span class="opt-letter">${letter}</span>${opt}</button>`;
    }).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${idx + 1}</div>
        <span class="cat-tag ${catClass}">${catLabel}</span>
        <span class="cat-tag" style="background:linear-gradient(135deg,#37474f,#263238)">${q.topic || ''}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="opts">${optsHTML}</div>
      <div class="q-feedback" id="fb_${idx}"></div>
    `;
    cont.appendChild(card);
  });
}

function choose(idx, chosen, correct_idx) {
  const opts = activeQs[idx].opts;
  for (let i = 0; i < opts.length; i++) {
    const btn = document.getElementById('opt_' + idx + '_' + i);
    btn.disabled = true;
    if (i === correct_idx) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  }
  const fb = document.getElementById('fb_' + idx);
  const card = document.getElementById('card_' + idx);
  const q = activeQs[idx];
  const isRight = chosen === correct_idx;

  if (isRight) { correct++; card.classList.add('answered-correct'); }
  else { wrong++; card.classList.add('answered-wrong'); }

  answered++;
  fb.style.display = 'block';
  fb.className = 'q-feedback ' + (isRight ? 'correct' : 'wrong');
  fb.innerHTML = `<strong>${isRight ? '✅' : '❌'} ${q.exp || ''}</strong>`;

  updateSticky();
  if (answered === activeQs.length) document.getElementById('submitBtn').disabled = false;
}

function updateSticky() {
  const total = activeQs.length;
  document.getElementById('sNum').textContent = answered + '/' + total;
  document.getElementById('sC').textContent = '✅ ' + correct;
  document.getElementById('sW').textContent = '❌ ' + wrong;
  document.getElementById('sP').textContent = '📊 ' + (total > 0 ? Math.round((correct/total)*100) : 0) + '%';
  document.getElementById('sFill').style.width = (total > 0 ? (answered/total)*100 : 0) + '%';
}

function showResults() {
  const box = document.getElementById('resultsBox');
  box.style.display = 'block';
  box.scrollIntoView({behavior:'smooth'});
  const total = activeQs.length;
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;
  document.getElementById('rScore').textContent = correct;
  document.getElementById('rTotal').textContent = total;
  document.getElementById('rC').textContent = correct;
  document.getElementById('rW').textContent = wrong;
  document.getElementById('rP').textContent = pct + '%';
  const msgs = ['🌟 Excellent! Keep it up!','👏 Great job!','💪 Good effort!','📚 Keep studying!','🔄 Practice makes perfect!'];
  document.getElementById('rMsg').textContent = pct>=90?msgs[0]:pct>=75?msgs[1]:pct>=60?msgs[2]:pct>=40?msgs[3]:msgs[4];
  const offset = 402 - (402 * pct / 100);
  document.getElementById('ringFg').style.strokeDashoffset = offset;

  const rev = document.getElementById('reviewDiv');
  const wrongs = activeQs.filter((q,i) => {
    const btns = document.querySelectorAll(`[id^="opt_${i}_"]`);
    return Array.from(btns).some(b => b.classList.contains('wrong'));
  });
  if (wrongs.length > 0) {
    rev.innerHTML = `<h3>❌ Questions to Review (${wrongs.length})</h3>` +
      wrongs.map(q => `<div class="rev-item wrong">
        <div class="rt">${q.q}</div>
        <div style="color:#065f46;font-weight:600;margin-top:4px">✅ ${q.opts[q.c]}</div>
        <div class="exp">${q.exp || ''}</div>
      </div>`).join('');
  } else {
    rev.innerHTML = '<h3>🎉 Perfect Score! All questions answered correctly!</h3>';
  }
}

function goHome() {
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('quizWrapper').style.display = 'none';
  document.getElementById('stickyBar').style.display = 'none';
}

document.getElementById('qCount').textContent = ALL.length;
</script>
